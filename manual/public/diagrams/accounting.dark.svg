<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="accounting" data-theme="dark"><title id="diagram-title">资金与账务流转</title><desc id="diagram-desc">以可信业务结果驱动复式记账，预占资金按原业务结果收敛</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4c7e9" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#151e2b"/><text x="24" y="38" font-size="27" font-weight="650" fill="#e2ebf4" text-anchor="start">资金与账务流转</text><text x="24" y="70" font-size="18" font-weight="400" fill="#aabdd1" text-anchor="start">以可信业务结果驱动复式记账，预占资金按原业务结果收敛</text><rect x="24" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">确认收入</text><line x1="40" y1="164" x2="243" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 261 141 L 280 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="235" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">收到可信支付结果</text><path d="M 141.5 263 L 141.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="331" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">按订单规则拆分</text><text x="141.5" y="356" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">商户收入与平台费用</text><path d="M 141.5 371 L 141.5 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="412" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="439" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">复式记账</text><text x="141.5" y="464" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">重复事件不重复入账</text><rect x="283" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="300" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">02</text><text x="334" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">预占资金</text><line x1="299" y1="164" x2="502" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 520 141 L 539 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="235" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">商户可用余额</text><path d="M 400.5 263 L 400.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="343" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">发起退款或结算申请</text><path d="M 400.5 371 L 400.5 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="412" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="439" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">关联原业务</text><text x="400.5" y="464" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">转入专用预占</text><rect x="542" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="559" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">03</text><text x="593" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">确认原业务结果</text><line x1="558" y1="164" x2="761" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 779 141 L 798 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 659.5 190 L 755 229 L 659.5 268 L 564 229 Z" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="659.5" y="235" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">原业务实际结果</text><path d="M 659.5 269 L 659.5 278 L 554 278 L 554 494" fill="none" stroke="#a4c7e9" stroke-width="1.5"/><path d="M 554 326 L 564 326" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="566" y="288" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="578" y="308" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">确认成功</text><text x="659.5" y="339" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">结转预占与原费用</text><path d="M 554 410 L 564 410" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="566" y="372" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="578" y="392" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">失败 / 审核拒绝</text><text x="659.5" y="416" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">按规则释放</text><text x="659.5" y="439" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">至可用余额</text><path d="M 554 494 L 564 494" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="566" y="456" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="578" y="476" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">处理中 / 未知</text><text x="659.5" y="500" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">保留预占</text><text x="659.5" y="523" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">查询原业务</text><path d="M 754 494 L 768 494 L 768 229 L 757 229" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="801" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="818" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">04</text><text x="852" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">账务核查</text><line x1="817" y1="164" x2="1020" y2="164" stroke="#4a617d" stroke-width="1"/><rect x="817" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="918.5" y="235" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">原业务号关联资金流水</text><path d="M 918.5 263 L 918.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="817" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="918.5" y="331" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">核对收入、费用</text><text x="918.5" y="356" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">预占及可用余额</text><path d="M 918.5 371 L 918.5 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="817" y="412" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="918.5" y="439" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">审阅原始凭据</text><text x="918.5" y="464" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">与操作记录</text><rect x="24" y="594" width="1012" height="62" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="44" y="620" font-size="16.5" font-weight="400" fill="#aabdd1" text-anchor="start">账务流转必须能回溯到原业务记录；资金明细与业务状态应一并核对。</text><style>* { filter:none !important; }</style></svg>