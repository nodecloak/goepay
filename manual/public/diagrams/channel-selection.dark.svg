<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="channel-selection" data-theme="dark"><title id="diagram-title">收款通道选择流程</title><desc id="diagram-desc">授权来源、用户组路由与实时准入共同决定本次收款通道</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4c7e9" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#151e2b"/><text x="24" y="38" font-size="27" font-weight="650" fill="#e2ebf4" text-anchor="start">收款通道选择流程</text><text x="24" y="70" font-size="18" font-weight="400" fill="#aabdd1" text-anchor="start">授权来源、用户组路由与实时准入共同决定本次收款通道</text><rect x="24" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">确定授权来源</text><line x1="40" y1="164" x2="243" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 261 141 L 280 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M 141.5 190 L 237 229 L 141.5 268 L 46 229 Z" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="227" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">存在商户</text><text x="141.5" y="251" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">显式通道授权？</text><path d="M 141.5 269 L 141.5 278 L 36 278 L 36 430" fill="none" stroke="#a4c7e9" stroke-width="1.5"/><path d="M 36 326 L 46 326" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="288" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="60" y="308" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">有</text><text x="141.5" y="339" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">使用显式授权集合</text><path d="M 36 430 L 46 430" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="48" y="392" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="60" y="412" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">无</text><text x="141.5" y="443" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">读取公共默认收款池</text><rect x="283" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="300" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">02</text><text x="334" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">应用路由规则</text><line x1="299" y1="164" x2="502" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 520 141 L 539 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="235" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">读取当前有效用户组</text><path d="M 400.5 263 L 400.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="343" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">应用支付方式路由</text><path d="M 400.5 371 L 400.5 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="412" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="451" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">按规则轮询候选通道</text><rect x="542" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="559" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">03</text><text x="593" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">执行准入检查</text><line x1="558" y1="164" x2="761" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 779 141 L 798 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="659.5" y="223" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">商户与通道状态</text><text x="659.5" y="248" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">支付方式及金额限额</text><path d="M 659.5 263 L 659.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="659.5" y="343" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">风控规则与业务权限</text><path d="M 659.5 371 L 659.5 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="412" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="659.5" y="451" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">实名认证与保证金条件</text><rect x="801" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="818" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">04</text><text x="852" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">保存选择结果</text><line x1="817" y1="164" x2="1020" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 918.5 190 L 1014 229 L 918.5 268 L 823 229 Z" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="918.5" y="227" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">存在满足条件</text><text x="918.5" y="251" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">的可用通道？</text><path d="M 918.5 269 L 918.5 278 L 813 278 L 813 430" fill="none" stroke="#a4c7e9" stroke-width="1.5"/><path d="M 813 326 L 823 326" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="825" y="288" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="837" y="308" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">是</text><text x="918.5" y="332" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">保存实际通道与规则</text><text x="918.5" y="355" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">生成原订单支付材料</text><path d="M 813 430 L 823 430" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="825" y="392" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="837" y="412" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">否</text><text x="918.5" y="436" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">拒绝新收款</text><text x="918.5" y="459" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">返回具体原因</text><rect x="24" y="594" width="1012" height="62" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="44" y="620" font-size="16.5" font-weight="400" fill="#aabdd1" text-anchor="start">授权来源为空或无可用候选时，新收款会被拒绝；已有订单继续依据原订单资料处理。</text><style>* { filter:none !important; }</style></svg>