<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="774" viewBox="0 0 1060 774" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="business-architecture" data-theme="light"><title id="diagram-title">GOEPAY 业务架构</title><desc id="diagram-desc">四类业务角色通过商户经营、收款交易、资金账务、运营治理四个业务域协作；支付机构及银行提供外部资金服务，商户系统和消息渠道承接业务结果。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#376d9e" stroke-width="1.3"/></marker><marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1.6" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#376d9e" stroke-width="1.3"/></marker></defs><rect width="1060" height="774" fill="#ffffff"/><text x="24" y="38" font-size="27" font-weight="650" fill="#24364b" text-anchor="start">GOEPAY 业务架构</text><text x="24" y="70" font-size="18" font-weight="400" fill="#5d7188" text-anchor="start">围绕商户经营，连接收款交易、资金流转与平台治理</text><rect x="44" y="102" width="228" height="84" rx="8" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.4"/><text x="158" y="135" font-size="21" font-weight="600" fill="#24364b" text-anchor="middle">商户</text><text x="158" y="164" font-size="17" font-weight="400" fill="#5d7188" text-anchor="middle">接入 · 收款 · 售后</text><path d="M 158 187 L 158 216" fill="none" stroke="#376d9e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="292" y="102" width="228" height="84" rx="8" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.4"/><text x="406" y="135" font-size="21" font-weight="600" fill="#24364b" text-anchor="middle">付款用户</text><text x="406" y="164" font-size="17" font-weight="400" fill="#5d7188" text-anchor="middle">确认支付 · 接收退款</text><path d="M 406 187 L 406 216" fill="none" stroke="#376d9e" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="540" y="102" width="228" height="84" rx="8" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.4