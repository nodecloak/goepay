<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="settlement-flow" data-theme="dark"><title id="diagram-title">结算业务流程</title><desc id="diagram-desc">专用资金预占贯穿申请、审核与原付款结果核对</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4c7e9" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#151e2b"/><text x="24" y="38" font-size="27" font-weight="650" fill="#e2ebf4" text-anchor="start">结算业务流程</text><text x="24" y="70" font-size="18" font-weight="400" fill="#aabdd1" text-anchor="start">专用资金预占贯穿申请、审核与原付款结果核对</text><rect x="24" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">申请与预占</text><line x1="40" y1="164" x2="243" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 261 141 L 280 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="223" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">满足权限、周期</text><text x="141.5" y="248" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">及金额规则</text><path d="M 141.5 263 L 141.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="331" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">核对收款资料</text><text x="141.5" y="356" font-size="18" font-weight="400" fill=