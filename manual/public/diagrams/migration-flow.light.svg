<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="migration-flow" data-theme="light"><title id="diagram-title">存量数据迁移流程</title><desc id="diagram-desc">先取得一致备份与预检查报告，再导入、核对并逐步启用</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#376d9e" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#ffffff"/><text x="24" y="38" font-size="27" font-weight="650" fill="#24364b" text-anchor="start">存量数据迁移流程</text><text x="24" y="70" font-size="18" font-weight="400" fill="#5d7188" text-anchor="start">先取得一致备份与预检查报告，再导入、核对并逐步启用</text><rect x="24" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">准备一致数据</text><line x1="40" y1="164" x2="243" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 261 141 L 280 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="235" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">原站暂停写入</text><path d="M 141.5 263 L 141.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="343" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">取得一致 SQL 备份</text><path d="M 141.5 371 L 141.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="451" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">全新目标上传备份</text><rect x="283" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="300" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">02</text><text x="334" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">预检查与确认</text><line x1="299" y1="164" x2="502" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 520 141 L 539 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="400.5" y="191" font-size="15.5" font-weight="400" fill="#5d7188" text-anchor="middle">检查数据范围、金额与状态</text><path d="M 400.5 210 L 496 249 L 400.5 288 L 305 249 Z" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="400.5" y="255" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">报告存在阻塞项？</text><path d="M 400.5 289 L 400.5 298 L 295 298 L 295 450" fill="none" stroke="#376d9e" stroke-width="1.5"/><path d="M 295 346 L 305 346" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="307" y="308" width="187" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="319" y="328" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">无</text><text x="400.5" y="352" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">核对报告</text><text x="400.5" y="375" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">确认原迁移任务</text><path d="M 295 450 L 305 450" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="307" y="412" width="187" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="319" y="432" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">有</text><text x="400.5" y="456" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">处理原业务</text><text x="400.5" y="479" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">重新取得一致备份</text><rect x="542" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="559" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">03</text><text x="593" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">导入与核对</text><line x1="558" y1="164" x2="761" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 779 141 L 798 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="659.5" y="235" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">事务导入核心业务数据</text><path d="M 659.5 263 L 659.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="659.5" y="331" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">加密归档</text><text x="659.5" y="356" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">保留迁移记录</text><path d="M 659.5 371 L 659.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="659.5" y="439" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">核对期初余额</text><text x="659.5" y="464" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">与导入数量</text><rect x="801" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="818" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">04</text><text x="852" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">验收与切换</text><line x1="817" y1="164" x2="1020" y2="164" stroke="#b8c9da" stroke-width="1"/><rect x="817" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="223" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">重配用户组、通道</text><text x="918.5" y="248" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">及登录资料</text><path d="M 918.5 263 L 918.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="817" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="331" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">模拟验收</text><text x="918.5" y="356" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">逐个启用商户</text><path d="M 918.5 371 L 918.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="817" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="451" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">运营方按计划安排切流</text><rect x="24" y="594" width="1012" height="62" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="44" y="620" font-size="16.5" font-weight="400" fill="#5d7188" text-anchor="start">存在阻塞项时，先解决原业务或制定人工方案，再从一致备份重新开始预检查。</text><style>* { filter:none !important; }</style></svg>