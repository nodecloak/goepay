<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="certification-flow" data-theme="light"><title id="diagram-title">实名认证流程</title><desc id="diagram-desc">本人提交资料，服务端读取原核验结果后再完成本地认证</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#376d9e" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#ffffff"/><text x="24" y="38" font-size="27" font-weight="650" fill="#24364b" text-anchor="start">实名认证流程</text><text x="24" y="70" font-size="18" font-weight="400" fill="#5d7188" text-anchor="start">本人提交资料，服务端读取原核验结果后再完成本地认证</text><rect x="24" y="112" width="321.3333333333333" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">本人核对与提交</text><line x1="40" y1="164" x2="329.3333333333333" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 347.3333333333333 141 L 366.3333333333333 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="196" width="289.3333333333333" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="184.66666666666666" y="223" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">本人登录</text><text x="184.66666666666666" y="248" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">选择已开放的认证方式</text><path d="M 184.66666666666666 263 L 184.66666666666666 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="289.3333333333333" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="184.66666666666666" y="331" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">填写资料</text><text x="184.66666666666666" y="356" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">可选 OCR 辅助</text><path d="M 184.66666666666666 371 L 184.66666666666666 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="412" width="289.3333333333333" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="184.66666666666666" y="451" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">人工核对后确认提交</text><rect x="369.3333333333333" y="112" width="321.3333333333333" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="386.3333333333333" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">02</text><text x="420.3333333333333" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">核验原认证</text><line x1="385.3333333333333" y1="164" x2="674.6666666666666" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 692.6666666666666 141 L 711.6666666666666 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="530" y="191" font-size="15.5" font-weight="400" fill="#5d7188" text-anchor="middle">完成服务商要求后主动查询</text><path d="M 530 210 L 668.6666666666666 249 L 530 288 L 391.3333333333333 249 Z" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="530" y="255" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">服务端可信结果</text><path d="M 530 289 L 530 298 L 381.3333333333333 298 L 381.3333333333333 514" fill="none" stroke="#376d9e" stroke-width="1.5"/><path d="M 381.3333333333333 346 L 391.3333333333333 346" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="393.3333333333333" y="308" width="273.3333333333333" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="405.3333333333333" y="328" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">已通过</text><text x="530" y="359" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">继续核对本地完成条件</text><path d="M 381.3333333333333 430 L 391.3333333333333 430" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="393.3333333333333" y="392" width="273.3333333333333" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="405.3333333333333" y="412" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">未通过</text><text x="530" y="436" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">查看失败原因</text><text x="530" y="459" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">按页面提示处理</text><path d="M 381.3333333333333 514 L 391.3333333333333 514" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="393.3333333333333" y="476" width="273.3333333333333" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="405.3333333333333" y="496" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">待处理 / 未知</text><text x="530" y="527" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">继续查询原认证</text><path d="M 667.6666666666666 514 L 681.6666666666666 514 L 681.6666666666666 249 L 670.6666666666666 249" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="714.6666666666666" y="112" width="321.3333333333333" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="731.6666666666666" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">03</text><text x="765.6666666666666" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">完成本地认证</text><line x1="730.6666666666666" y1="164" x2="1020" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 875.3333333333333 190 L 1014 229 L 875.3333333333333 268 L 736.6666666666666 229 Z" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="875.3333333333333" y="227" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">余额与本地条件</text><text x="875.3333333333333" y="251" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">是否满足？</text><path d="M 875.3333333333333 269 L 875.3333333333333 278 L 726.6666666666666 278 L 726.6666666666666 430" fill="none" stroke="#376d9e" stroke-width="1.5"/><path d="M 726.6666666666666 326 L 736.6666666666666 326" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="738.6666666666666" y="288" width="273.3333333333333" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="750.6666666666666" y="308" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">是</text><text x="875.3333333333333" y="332" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">同事务完成认证与扣费</text><text x="875.3333333333333" y="355" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">显示已认证状态</text><path d="M 726.6666666666666 430 L 736.6666666666666 430" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="738.6666666666666" y="392" width="273.3333333333333" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="750.6666666666666" y="412" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">否</text><text x="875.3333333333333" y="436" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">保留有效通过证明</text><text x="875.3333333333333" y="459" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">按提示补足条件</text><path d="M 1013 430 L 1027 430 L 1027 229 L 1016 229" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="24" y="594" width="1012" height="62" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="44" y="620" font-size="16.5" font-weight="400" fill="#5d7188" text-anchor="start">浏览器返回或页面提示不能替代服务端核验；原核验通过后仍需满足本地完成条件。</text><style>* { filter:none !important; }</style></svg>