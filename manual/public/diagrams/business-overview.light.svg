<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="business-overview" data-theme="light"><title id="diagram-title">业务全景流程</title><desc id="diagram-desc">商户开通、收款确认、业务通知与资金结算形成完整闭环</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#376d9e" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#ffffff"/><text x="24" y="38" font-size="27" font-weight="650" fill="#24364b" text-anchor="start">业务全景流程</text><text x="24" y="70" font-size="18" font-weight="400" fill="#5d7188" text-anchor="start">商户开通、收款确认、业务通知与资金结算形成完整闭环</text><rect x="24" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">商户开通</text><line x1="40" y1="164" x2="243" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 261 141 L 280 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="235" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">配置通道与用户组</text><path d="M 141.5 263 L 141.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="331" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">创建商户</text><text x="141.5" y="356" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">完成必要认证</text><path d="M 141.5 371 L 141.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="451" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">核对接入资料与费率</text><rect x="283" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="300" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">02</text><text x="334" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">收款交易</text><line x1="299" y1="164" x2="502" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 520 141 L 539 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="400.5" y="235" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">商户下单 / 聚合收款</text><path d="M 400.5 263 L 400.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="400.5" y="343" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">用户本人确认付款</text><path d="M 400.5 371 L 400.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="400.5" y="451" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">可信回调确认订单</text><rect x="542" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="559" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">03</text><text x="593" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">账务与业务结果</text><line x1="558" y1="164" x2="761" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 779 141 L 798 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="659.5" y="223" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">订单、入账与通知任务</text><text x="659.5" y="248" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">同事务提交</text><path d="M 659.5 263 L 659.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="659.5" y="331" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">商户验签</text><text x="659.5" y="356" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">幂等更新业务</text><path d="M 659.5 371 L 659.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="659.5" y="451" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">按原订单处理售后</text><rect x="801" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="818" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">04</text><text x="852" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">结算与核查</text><line x1="817" y1="164" x2="1020" y2="164" stroke="#b8c9da" stroke-width="1"/><rect x="817" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="235" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">达到条件后申请结算</text><path d="M 918.5 263 L 918.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="817" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="343" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">审核与原单付款</text><path d="M 918.5 371 L 918.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="817" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="439" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">核对资金明细</text><text x="918.5" y="464" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">与实际到账</text><rect x="24" y="594" width="1012" height="62" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="44" y="620" font-size="16.5" font-weight="400" fill="#5d7188" text-anchor="start">每个业务结果都通过原订单、原退款号或原结算申请关联核查。</text><style>* { filter:none !important; }</style></svg>