<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="merchant-onboarding" data-theme="light"><title id="diagram-title">商户开通流程</title><desc id="diagram-desc">平台先备齐业务规则，商户本人核对资料并完成接入验收</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#376d9e" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#ffffff"/><text x="24" y="38" font-size="27" font-weight="650" fill="#24364b" text-anchor="start">商户开通流程</text><text x="24" y="70" font-size="18" font-weight="400" fill="#5d7188" text-anchor="start">平台先备齐业务规则，商户本人核对资料并完成接入验收</text><rect x="24" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">平台准备</text><line x1="40" y1="164" x2="243" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 261 141 L 280 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="235" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">启用支付产品与通道</text><path d="M 141.5 263 L 141.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="343" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">核对凭据、能力与状态</text><path d="M 141.5 371 L 141.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="141.5" y="439" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">配置公共池</text><text x="141.5" y="464" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">或显式通道授权</text><rect x="283" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="300" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">02</text><text x="334" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">商户开通</text><line x1="299" y1="164" x2="502" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 520 141 L 539 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="400.5" y="235" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">设置用户组路由与费率</text><path d="M 400.5 263 L 400.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="400.5" y="343" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">创建商户并指定分组</text><path d="M 400.5 371 L 400.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="400.5" y="451" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">本人登录，核对商户号</text><rect x="542" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="559" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">03</text><text x="593" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">准入核验</text><line x1="558" y1="164" x2="761" y2="164" stroke="#b8c9da" stroke-width="1"/><path d="M 779 141 L 798 141" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><text x="659.5" y="191" font-size="15.5" font-weight="400" fill="#5d7188" text-anchor="middle">按要求认证、补足保证金</text><path d="M 659.5 210 L 755 249 L 659.5 288 L 564 249 Z" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="659.5" y="247" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">通道与费率</text><text x="659.5" y="271" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">符合预期？</text><path d="M 659.5 289 L 659.5 298 L 554 298 L 554 450" fill="none" stroke="#376d9e" stroke-width="1.5"/><path d="M 554 346 L 564 346" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="566" y="308" width="187" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="578" y="328" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">是</text><text x="659.5" y="359" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">继续接入验收</text><path d="M 554 450 L 564 450" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="566" y="412" width="187" height="76" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="578" y="432" font-size="14.5" font-weight="600" fill="#376d9e" text-anchor="start">否</text><text x="659.5" y="456" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">调整分组或通道授权</text><text x="659.5" y="479" font-size="17" font-weight="400" fill="#24364b" text-anchor="middle">重新核对</text><path d="M 754 450 L 768 450 L 768 249 L 757 249" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="801" y="112" width="235" height="456" rx="9" fill="#f7f9fc" stroke="#b8c9da" stroke-width="1.3"/><text x="818" y="146" font-size="17" font-weight="650" fill="#376d9e" text-anchor="start">04</text><text x="852" y="146" font-size="19" font-weight="650" fill="#24364b" text-anchor="start">接入验收</text><line x1="817" y1="164" x2="1020" y2="164" stroke="#b8c9da" stroke-width="1"/><rect x="817" y="196" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="235" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">本地模拟下单与回调</text><path d="M 918.5 263 L 918.5 300" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="817" y="304" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="331" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">核对订单、入账</text><text x="918.5" y="356" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">及签名通知</text><path d="M 918.5 371 L 918.5 408" fill="none" stroke="#376d9e" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="817" y="412" width="203" height="66" rx="7" fill="#edf4fb" stroke="#b8c9da" stroke-width="1.3"/><text x="918.5" y="451" font-size="18" font-weight="400" fill="#24364b" text-anchor="middle">资料确认后按范围启用</text><rect x="24" y="594" width="1012" height="62" rx="6" fill="#f0f5fa" stroke="#e1eaf4" stroke-width="1.3"/><text x="44" y="620" font-size="16.5" font-weight="400" fill="#5d7188" text-anchor="start">商户接入前，应从本人后台确认实际可用通道、支付方式、费率与权限。</text><style>* { filter:none !important; }</style></svg>