<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="merchant-day" data-theme="dark"><title id="diagram-title">商户日常经营流程</title><desc id="diagram-desc">从营业准备、交易处理到资金核对与结算</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4c7e9" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#151e2b"/><text x="24" y="38" font-size="27" font-weight="650" fill="#e2ebf4" text-anchor="start">商户日常经营流程</text><text x="24" y="70" font-size="18" font-weight="400" fill="#aabdd1" text-anchor="start">从营业准备、交易处理到资金核对与结算</text><rect x="24" y="112" width="321.3333333333333" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">开始营业</text><line x1="40" y1="164" x2="329.3333333333333" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 347.3333333333333 141 L 366.3333333333333 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="196" width="289.3333333333333" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="184.66666666666666" y="223" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">本人登录</text><text x="184.66666666666666" y="248" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">确认商户号</text><path d="M 184.66666666666666 263 L 184.66666666666666 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="289.3333333333333" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="184.66666666666666" y="331" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">核对通道、费率</text><text x="184.66666666666666" y="356" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">与接入资料</text><rect x="369.3333333333333" y="112" width="321.3333333333333" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="386.3333333333333" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">02</text><text x="420.3333333333333" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">处理交易</text><line x1="385.3333333333333" y1="164" x2="674.6666666666666" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 692.6666666666666 141 L 711.6666666666666 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="385.3333333333333" y="196" width="289.3333333333333" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="530" y="223" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">业务系统下单</text><text x="530" y="248" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">或聚合收款</text><path d="M 530 263 L 530 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="385.3333333333333" y="304" width="289.3333333333333" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="530" y="343" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">查看订单及商户通知</text><path d="M 530 371 L 530 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="385.3333333333333" y="412" width="289.3333333333333" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="530" y="451" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">按原订单处理退款售后</text><rect x="714.6666666666666" y="112" width="321.3333333333333" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="731.6666666666666" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">03</text><text x="765.6666666666666" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">核对与结算</text><line x1="730.6666666666666" y1="164" x2="1020" y2="164" stroke="#4a617d" stroke-width="1"/><rect x="730.6666666666666" y="196" width="289.3333333333333" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="875.3333333333333" y="223" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">核对收入、费用</text><text x="875.3333333333333" y="248" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">与资金明细</text><path d="M 875.3333333333333 263 L 875.3333333333333 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="730.6666666666666" y="304" width="289.3333333333333" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="875.3333333333333" y="343" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">满足条件后申请提现</text><path d="M 875.3333333333333 371 L 875.3333333333333 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="730.6666666666666" y="412" width="289.3333333333333" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="875.3333333333333" y="439" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">查看原结算</text><text x="875.3333333333333" y="464" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">及实际到账</text><rect x="24" y="594" width="1012" height="62" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="44" y="620" font-size="16.5" font-weight="400" fill="#aabdd1" text-anchor="start">日常核查以服务端可信状态、原业务记录和资金明细为依据。</text><style>* { filter:none !important; }</style></svg>