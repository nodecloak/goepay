<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="680" viewBox="0 0 1060 680" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="notification-flow" data-theme="dark"><title id="diagram-title">业务通知投递流程</title><desc id="diagram-desc">事件、投递目标与每次执行留痕相互关联</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4c7e9" stroke-width="1.3"/></marker></defs><rect width="1060" height="680" fill="#151e2b"/><text x="24" y="38" font-size="27" font-weight="650" fill="#e2ebf4" text-anchor="start">业务通知投递流程</text><text x="24" y="70" font-size="18" font-weight="400" fill="#aabdd1" text-anchor="start">事件、投递目标与每次执行留痕相互关联</text><rect x="24" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="41" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">01</text><text x="75" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">形成事件</text><line x1="40" y1="164" x2="243" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 261 141 L 280 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="235" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">可信业务事件发生</text><path d="M 141.5 263 L 141.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="331" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">持久保存事件</text><text x="141.5" y="356" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">或原通知任务</text><path d="M 141.5 371 L 141.5 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="40" y="412" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="141.5" y="451" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">按业务号关联原记录</text><rect x="283" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="300" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">02</text><text x="334" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">确定投递</text><line x1="299" y1="164" x2="502" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 520 141 L 539 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="223" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">检查平台渠道</text><text x="400.5" y="248" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">与事件开关</text><path d="M 400.5 263 L 400.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="331" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">检查商户偏好</text><text x="400.5" y="356" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">及可信接收目标</text><path d="M 400.5 371 L 400.5 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="299" y="412" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="400.5" y="439" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">确定本次账号</text><text x="400.5" y="464" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">模板与收件人</text><rect x="542" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="559" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">03</text><text x="593" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">执行与留痕</text><line x1="558" y1="164" x2="761" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 779 141 L 798 141" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="196" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="659.5" y="223" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">邮件、短信、机器人</text><text x="659.5" y="248" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">语音或打印等投递</text><path d="M 659.5 263 L 659.5 300" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="304" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="659.5" y="331" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">保存每次执行</text><text x="659.5" y="356" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">及实际响应</text><path d="M 659.5 371 L 659.5 408" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="558" y="412" width="203" height="66" rx="7" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="659.5" y="451" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">查看同一投递记录</text><rect x="801" y="112" width="235" height="456" rx="9" fill="#1b293b" stroke="#4a617d" stroke-width="1.3"/><text x="818" y="146" font-size="17" font-weight="650" fill="#a4c7e9" text-anchor="start">04</text><text x="852" y="146" font-size="19" font-weight="650" fill="#e2ebf4" text-anchor="start">核对实际结果</text><line x1="817" y1="164" x2="1020" y2="164" stroke="#4a617d" stroke-width="1"/><path d="M 918.5 190 L 1014 229 L 918.5 268 L 823 229 Z" fill="#243950" stroke="#4a617d" stroke-width="1.3"/><text x="918.5" y="235" font-size="18" font-weight="400" fill="#e2ebf4" text-anchor="middle">该渠道实际结果</text><path d="M 918.5 269 L 918.5 278 L 813 278 L 813 494" fill="none" stroke="#a4c7e9" stroke-width="1.5"/><path d="M 813 326 L 823 326" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="825" y="288" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="837" y="308" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">成功</text><text x="918.5" y="339" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">完成原投递记录</text><path d="M 813 410 L 823 410" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="825" y="372" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="837" y="392" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">明确失败</text><text x="918.5" y="423" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">按渠道规则处理重试</text><path d="M 813 494 L 823 494" fill="none" stroke="#a4c7e9" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="825" y="456" width="187" height="76" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="837" y="476" font-size="14.5" font-weight="600" fill="#a4c7e9" text-anchor="start">外部效果未知</text><text x="918.5" y="500" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">先核实实际状态</text><text x="918.5" y="523" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="middle">再决定后续处理</text><rect x="24" y="594" width="1012" height="62" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.3"/><text x="44" y="620" font-size="16.5" font-weight="400" fill="#aabdd1" text-anchor="start">各渠道使用各自的核对和重试规则；语音、打印等外部效果未知时需先核实。</text><style>* { filter:none !important; }</style></svg>