<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="820" viewBox="0 0 1060 820" role="img" aria-labelledby="diagram-title diagram-desc" style="max-width:100%;height:auto;font-family:'Segoe UI','Microsoft YaHei',sans-serif" data-diagram="system-architecture" data-theme="dark"><title id="diagram-title">GOEPAY 系统架构</title><desc id="diagram-desc">Vue 后台与收银台及商户系统通过 HTTP 接入 Go 服务。服务内分订单支付、通道适配、资金结算、商户运营模块；PostgreSQL 保存业务、账务和持久任务，Worker 执行通知及原单核对，并经适配层连接外部机构。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6.4" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#a4c7e9" stroke-width="1.3"/></marker><marker id="arrow-start" markerWidth="8" markerHeight="8" refX="1.6" refY="4" orient="auto"><path d="M7 1 L1 4 L7 7" fill="none" stroke="#a4c7e9" stroke-width="1.3"/></marker></defs><rect width="1060" height="820" fill="#151e2b"/><text x="24" y="38" font-size="27" font-weight="650" fill="#e2ebf4" text-anchor="start">GOEPAY 系统架构</text><text x="24" y="70" font-size="18" font-weight="400" fill="#aabdd1" text-anchor="start">接入、业务处理、持久任务与外部适配的职责边界</text><rect x="24" y="102" width="312" height="84" rx="8" fill="#1b293b" stroke="#4a617d" stroke-width="1.4"/><text x="180" y="135" font-size="21" font-weight="600" fill="#e2ebf4" text-anchor="middle">管理后台</text><text x="180" y="164" font-size="17" font-weight="400" fill="#aabdd1" text-anchor="middle">运营配置 · 审核 · 账务核查</text><path d="M 180 187 L 180 216" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="374" y="102" width="312" height="84" rx="8" fill="#1b293b" stroke="#4a617d" stroke-width="1.4"/><text x="530" y="135" font-size="21" font-weight="600" fill="#e2ebf4" text-anchor="middle">商户后台与业务系统</text><text x="530" y="164" font-size="17" font-weight="400" fill="#aabdd1" text-anchor="middle">Vue 后台 · 商户签名 API</text><path d="M 530 187 L 530 216" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="724" y="102" width="312" height="84" rx="8" fill="#1b293b" stroke="#4a617d" stroke-width="1.4"/><text x="880" y="135" font-size="21" font-weight="600" fill="#e2ebf4" text-anchor="middle">付款用户</text><text x="880" y="164" font-size="17" font-weight="400" fill="#aabdd1" text-anchor="middle">收银台 · 浏览器 · 支付应用</text><path d="M 880 187 L 880 216" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="24" y="218" width="1012" height="376" rx="10" fill="#1b293b" stroke="#4a617d" stroke-width="1.4"/><text x="44" y="250" font-size="19" font-weight="600" fill="#e2ebf4" text-anchor="start">Go 服务</text><rect x="44" y="270" width="972" height="58" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.4"/><text x="530" y="306" font-size="19" font-weight="500" fill="#e2ebf4" text-anchor="middle">HTTP 接入层　路由 · 会话 / API 签名 · 权限与参数校验</text><path d="M 158 329 L 158 351" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="44" y="355" width="228" height="116" rx="8" fill="#243950" stroke="#4a617d" stroke-width="1.4"/><text x="62" y="389" font-size="21" font-weight="650" fill="#e2ebf4" text-anchor="start">订单与支付</text><text x="62" y="421" font-size="17.5" font-weight="400" fill="#e2ebf4" text-anchor="start">下单 · 回调 · 查询</text><text x="62" y="449" font-size="17.5" font-weight="400" fill="#e2ebf4" text-anchor="start">退款 · 订单状态</text><path d="M 406 329 L 406 351" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="292" y="355" width="228" height="116" rx="8" fill="#243950" stroke="#4a617d" stroke-width="1.4"/><text x="310" y="389" font-size="21" font-weight="650" fill="#e2ebf4" text-anchor="start">通道与适配</text><text x="310" y="421" font-size="17.5" font-weight="400" fill="#e2ebf4" text-anchor="start">授权 · 路由 · 费率</text><text x="310" y="449" font-size="17.5" font-weight="400" fill="#e2ebf4" text-anchor="start">机构协议 · 验签</text><path d="M 654 329 L 654 351" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="540" y="355" width="228" height="116" rx="8" fill="#243950" stroke="#4a617d" stroke-width="1.4"/><text x="558" y="389" font-size="21" font-weight="650" fill="#e2ebf4" text-anchor="start">资金与结算</text><text x="558" y="421" font-size="17.5" font-weight="400" fill="#e2ebf4" text-anchor="start">复式账务 · 专用预占</text><text x="558" y="449" font-size="17.5" font-weight="400" fill="#e2ebf4" text-anchor="start">申请 · 审批 · 付款</text><path d="M 902 329 L 902 351" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="788" y="355" width="228" height="116" rx="8" fill="#243950" stroke="#4a617d" stroke-width="1.4"/><text x="806" y="389" font-size="21" font-weight="650" fill="#e2ebf4" text-anchor="start">商户与运营</text><text x="806" y="421" font-size="17.5" font-weight="400" fill="#e2ebf4" text-anchor="start">分组 · 认证 · 风控</text><text x="806" y="449" font-size="17.5" font-weight="400" fill="#e2ebf4" text-anchor="start">通知 · 报表 · 审计</text><rect x="44" y="499" width="312" height="72" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.4"/><text x="62" y="527" font-size="18.5" font-weight="600" fill="#e2ebf4" text-anchor="start">Worker · 异步通知</text><text x="62" y="554" font-size="17" font-weight="400" fill="#aabdd1" text-anchor="start">商户回调 · 业务消息</text><rect x="374" y="499" width="312" height="72" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.4"/><text x="392" y="527" font-size="18.5" font-weight="600" fill="#e2ebf4" text-anchor="start">Worker · 原单核对</text><text x="392" y="554" font-size="17" font-weight="400" fill="#aabdd1" text-anchor="start">支付 · 退款 · 结算</text><rect x="704" y="499" width="312" height="72" rx="6" fill="#243447" stroke="#354c67" stroke-width="1.4"/><text x="722" y="527" font-size="18.5" font-weight="600" fill="#e2ebf4" text-anchor="start">Worker · 授权调度</text><text x="722" y="554" font-size="17" font-weight="400" fill="#aabdd1" text-anchor="start">计划任务 · 执行记录</text><path d="M 282 595 L 282 658" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><path d="M 778 595 L 778 658" fill="none" stroke="#a4c7e9" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/><text x="302" y="632" font-size="15" font-weight="400" fill="#aabdd1" text-anchor="start">事务与持久化任务</text><text x="798" y="632" font-size="15" font-weight="400" fill="#aabdd1" text-anchor="start">API / 回调 / 投递</text><rect x="24" y="662" width="492" height="132" rx="8" fill="#1b293b" stroke="#4a617d" stroke-width="1.4"/><text x="46" y="699" font-size="22" font-weight="600" fill="#e2ebf4" text-anchor="start">PostgreSQL</text><text x="46" y="735" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="start">订单 · 复式账务 · 配置与规则快照</text><text x="46" y="765" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="start">事件收件箱 / 发件箱 · 持久任务 · 审计记录</text><rect x="544" y="662" width="492" height="132" rx="8" fill="#1b293b" stroke="#4a617d" stroke-width="1.4"/><text x="566" y="699" font-size="22" font-weight="600" fill="#e2ebf4" text-anchor="start">外部机构与服务</text><text x="566" y="735" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="start">支付宝 · 微信 · 银行 · 认证服务</text><text x="566" y="765" font-size="17" font-weight="400" fill="#e2ebf4" text-anchor="start">商户通知地址 · 邮件 / 短信 / 机器人等</text><style>* { filter:none !important; }</style></svg>