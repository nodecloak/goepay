map $uri $logged_path {
    default $uri;
    ~^/identity/ /identity/[redacted];
}
# SDK exceptions belong to a fresh cashier document. Keep the original request
# URI because SPA try_files internally redirects the document to /index.html.
map $request_uri $goepay_csp {
    default "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    ~^/merchant/scanpay([?]|$) "default-src 'self'; script-src 'self' https://res.wx.qq.com/open/js/jweixin-1.6.3.js https://gw.alipayobjects.com/as/g/h5-lib/alipayjsapi/3.1.1/alipayjsapi.min.js; style-src 'self'; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'";
    ~^/test/?([?]|$) "default-src 'self'; script-src 'self' https://static.geetest.com https://api.geetest.com https://apiv6.geetest.com https://api.geevisit.com https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://static.geevisit.com https://dn-staticdown.qbox.me; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com https://dn-staticdown.qbox.me; img-src 'self' data: blob: https:; connect-src 'self' https://static.geetest.com https://static.geevisit.com https://dn-staticdown.qbox.me https://api.geetest.com https://apiv6.geetest.com https://api.geevisit.com https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; frame-src 'self' https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; font-src 'self' data: https://static.geetest.com https://static.geevisit.com; media-src 'self' blob: https://static.geetest.com https://static.geevisit.com; worker-src 'self' blob:; object-src 'none'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'";
    ~^/merchant/login([?]|$) "default-src 'self'; script-src 'self' https://static.geetest.com https://api.geetest.com https://apiv6.geetest.com https://api.geevisit.com https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com https://static.geevisit.com https://dn-staticdown.qbox.me; style-src 'self' 'unsafe-inline' https://static.geetest.com https://static.geevisit.com https://dn-staticdown.qbox.me; img-src 'self' data: blob: https:; connect-src 'self' https://static.geetest.com https://static.geevisit.com https://dn-staticdown.qbox.me https://api.geetest.com https://apiv6.geetest.com https://api.geevisit.com https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; frame-src 'self' https://gcaptcha4.geetest.com https://gcaptcha4.geevisit.com https://gcaptcha4.gsensebot.com; font-src 'self' data: https://static.geetest.com https://static.geevisit.com; media-src 'self' blob: https://static.geetest.com https://static.geevisit.com; worker-src 'self' blob:; object-src 'none'; form-action 'self'; base-uri 'self'; frame-ancestors 'none'";
}
log_format path_only '$remote_addr [$time_local] "$request_method $logged_path $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    access_log /var/log/nginx/access.log path_only;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream http://api:8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy $goepay_csp always;
    # Only template previews may be framed by this console. Local headers
    # replace the global DENY/frame-ancestors-none policy here; the API sends
    # each preview's own CSP (a sandbox without scripts for built-in, pay and
    # qrpay templates; a sandbox without the site's origin for uploaded home
    # pages, whose scripts run).
    location ~ ^/console/v1/admin/templates/(home|pay|qrpay)/([a-z0-9-]+)/(preview|versions/[0-9]+/preview)$ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options SAMEORIGIN always;
        proxy_hide_header X-Frame-Options;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Template packages (zip, at most 10 MiB) are uploaded here only.
    location ~ ^/console/v1/admin/templates/(home|pay|qrpay)/uploads(/check)?$ {
        client_max_body_size 11m;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Migration backups: 64 MiB file plus bounded multipart metadata. Stream
    # the authenticated upload to the API instead of buffering plaintext SQL
    # in nginx temporary files. The API enforces the stricter body/file limits.
    location = /console/v1/admin/migration/epay/prepare {
        client_max_body_size 65m;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /console/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /user/invite/inviteInfo {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /user/invite/inviteList {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Uploaded collection templates load their own style sheets, fonts and
    # images from this site; no script source is ever allowed.
    location /collect/ {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline' 'self'; img-src 'self' data:; font-src 'self' data:; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /identity/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location ~ ^/static/img/(logo|icon)\.png$ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }
    location /template-assets/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Files of uploaded template versions (immutable, cached by the API).
    location /template-files/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /collection-style-assets/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /healthz {
        proxy_pass $api_upstream;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Developer documentation (/doc/), the original test-pay address
    # (/user/test -> /test), the service agreement (/agreement.html) and the
    # cashier pages that console pages such as /test link to are rendered by
    # the API, each with its own CSP, so the console policy is not added.
    location = /agreement.html {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /agreement {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /doc {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /doc/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location = /user/test {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /checkout/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # Original homepage modes are rendered by the API, including its own CSP.
    location = / {
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / { try_files $uri $uri/ /index.html; }
}
