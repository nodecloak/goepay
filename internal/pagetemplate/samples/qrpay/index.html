<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}} - {{brand_name}}</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="qr-page">
  <div class="qr-shell">
    <header class="qr-header">
      <img class="qr-logo" src="images/logo.svg" alt="{{brand_name}}" width="40" height="40">
      <span class="qr-brand">{{brand_name}}</span>
    </header>

    <p class="qr-help">打开微信或支付宝，扫描下方二维码完成支付。</p>

    <div class="qr-body">
      {{content}}
    </div>

    <footer class="qr-footer">
      <p>聚合收款由 {{brand_name}} 提供</p>
      <p>© {{year}} {{brand_name}}</p>
    </footer>
  </div>
</body>
</html>
