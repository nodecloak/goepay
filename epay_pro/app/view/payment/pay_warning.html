<html class="weui-msg">
<head>
    <meta charset="UTF-8">
    <meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>支付提示页面</title>
    <link href="/static/css/weui.min.css" rel="stylesheet">
    <style>.page{position:absolute;top:0;right:0;bottom:0;left:0;overflow-y:auto;-webkit-overflow-scrolling:touch;box-sizing:border-box}</style>
</head>
<body>
<div class="container">
<div class="page">
<div class="weui-msg">
    <div class="weui-msg__icon-area">
        <i class="weui-icon-warn weui-icon_msg-primary"></i>
    </div>
    <div class="weui-msg__text-area">
        <h2 class="weui-msg__title">防诈骗提醒</h2>
        <p class="weui-msg__desc">您当前支付的商品为 <span style="font-weight:600;color:orange">{$order.name}</span> ，请勿用他人发过来的二维码或链接进行支付，以防资金损失！</p>
    </div>
    <div class="weui-msg__opr-area">
        <p class="weui-btn-area">
            <a href="{$order.payurl}" class="weui-btn weui-btn_primary">继续支付</a>
        </p>
    </div>
    <div class="weui-msg__opr-area">
        <p class="weui-btn-area">
            <a href="javascript:;" class="weui-btn weui-btn_default" id="Close">关闭</a>
        </p>
    </div>
    <div class="weui-msg__extra-area">
        <div class="weui-footer"><p class="weui-footer__links"></p><p class="weui-footer__text">Copyright © {:date("Y")} {:config_get('sitename')}</p></div>
    </div>
</div>
</div>
</div>
<script src="{$cdnpublic}jquery/1.12.4/jquery.min.js"></script>
<script src="/static/js/close.js"></script>
<script>
document.body.addEventListener('touchmove', function (event) {
	event.preventDefault();
},{ passive: false });
</script>
</body>
</html>
