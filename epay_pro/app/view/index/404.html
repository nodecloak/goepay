<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 页面不存在</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f5f7fb;
            color: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .error-wrap {
            width: 100%;
            max-width: 560px;
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
            padding: 48px 28px;
        }

        .code {
            font-size: 72px;
            line-height: 1;
            font-weight: 700;
            color: #3f7cff;
            margin-bottom: 16px;
        }

        .title {
            font-size: 24px;
            margin-bottom: 12px;
            color: #1f2937;
        }

        .desc {
            font-size: 15px;
            color: #6b7280;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .btn-home {
            display: inline-block;
            padding: 11px 26px;
            border-radius: 8px;
            background: #3f7cff;
            color: #fff;
            text-decoration: none;
            transition: background-color 0.2s ease;
        }

        .btn-home:hover {
            background: #2f68e5;
        }
    </style>
</head>
<body>
    <div class="error-wrap">
        <div class="code">404</div>
        <h1 class="title">页面不存在</h1>
        <p class="desc">抱歉，您访问的页面不存在或已被移除。</p>
        <a class="btn-home" href="/">返回首页</a>
    </div>
</body>
</html>
